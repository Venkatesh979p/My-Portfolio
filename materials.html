<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Study Materials</title>

  <style>

    body {
      margin: 0;
      padding: 30px;
      font-family: "Segoe UI", sans-serif;
      color: white;
      background: #111;
    }

    .container {
      max-width: 1000px;
      margin: auto;
    }

    h1 {
      text-align: center;
      color: #ff00cc;
    }

    .subjects-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      margin-top: 30px;
    }

    .subject-card {
      background: #2a2a2a;
      border: 1px solid #555;
      border-radius: 15px;
      padding: 25px;
      text-align: center;
      cursor: pointer;
      transition: 0.3s;
    }

    .subject-card:hover {
      transform: translateY(-5px);
      border-color: #ff00cc;
      box-shadow: 0 0 20px #ff00cc66;
    }

    .subject-card span {
      font-size: 40px;
    }

    .subject-card h3 {
      color: white;
    }

    .subject-card p {
      color: #aaa;
    }

    #topicsPage {
      display: none;
    }

    .back-btn {
      padding: 10px 18px;
      border: none;
      border-radius: 20px;
      background: linear-gradient(90deg,#ff00cc,#3333ff);
      color: white;
      cursor: pointer;
    }

    .topic-search {
      width: 100%;
      box-sizing: border-box;
      padding: 12px 18px;
      margin: 20px 0;
      border-radius: 25px;
      border: 2px solid #ff00cc;
      background: #222;
      color: white;
      outline: none;
    }

    .topic-card {
      background: #2a2a2a;
      padding: 18px;
      border-radius: 12px;
      margin-bottom: 15px;
    }

    .topic-card h3 {
      color: #ff00cc;
    }

    .topic-card p {
      color: #ccc;
    }

    .topic-btn {
      display: inline-block;
      padding: 8px 14px;
      border-radius: 20px;
      color: white;
      text-decoration: none;
      margin-right: 5px;
      border: none;
      cursor: pointer;
    }

    .view-topic {
      background: #00c853;
    }

    .download-topic {
      background: #0066ff;
    }

    @media(max-width:600px) {
      .subjects-grid {
        grid-template-columns: 1fr;
      }
    }

  </style>
</head>

<body>

<div class="container">

  <h1>📚 Study Materials</h1>

  <!-- SUBJECTS -->

  <div id="subjectsPage">

    <div class="subjects-grid">

      <div class="subject-card"
           onclick="openSubject('bme')">

        <span>⚙️</span>

        <h3>BME</h3>

        <p>Basic Mechanical Engineering</p>

      </div>


      <div class="subject-card"
           onclick="openSubject('thermal')">

        <span>🔥</span>

        <h3>Thermal Engineering</h3>

        <p>Thermal Engineering Topics</p>

      </div>


      <div class="subject-card"
           onclick="openSubject('manufacturing')">

        <span>🏭</span>

        <h3>Manufacturing</h3>

        <p>Manufacturing Technology</p>

      </div>


      <div class="subject-card"
           onclick="openSubject('python')">

        <span>🐍</span>

        <h3>Python</h3>

        <p>Python Programming</p>

      </div>

    </div>

  </div>


  <!-- TOPICS -->

  <div id="topicsPage">

    <button class="back-btn"
            onclick="backToSubjects()">

      ← Back to Subjects

    </button>

    <h2 id="selectedSubject"></h2>

    <input
      type="text"
      id="topicSearch"
      class="topic-search"
      placeholder="🔍 Search Topic..."
      onkeyup="searchTopics()"
    >

    <div id="topicsContainer"></div>

  </div>

</div>


<script>

const materialData = {

  bme: {
    name: "BME",

    topics: [

      {
        title: "Lesson 1",
        description: "Basic Mechanical Engineering - Lesson 1",
        pdf: "pdfsbme_lesson1.pdf"
      },

      {
        title: "Lesson 2",
        description: "Basic Mechanical Engineering - Lesson 2",
        pdf: "UNIT 2.pdf"
      },

      {
        title: "Lesson 3",
        description: "Basic Mechanical Engineering - Lesson 3",
        pdf: "unit-3.pdf"
      }

    ]
  },


  thermal: {

    name: "Thermal Engineering",

    topics: [

      {
        title: "Boilers",
        description: "Boiler definition, types and working",
        pdf: "boilers.pdf"
      },

      {
        title: "Otto Cycle",
        description: "Otto cycle and PV diagram",
        pdf: "otto-cycle.pdf"
      },

      {
        title: "Diesel Cycle",
        description: "Diesel cycle and PV diagram",
        pdf: "diesel-cycle.pdf"
      },

      {
        title: "Refrigeration",
        description: "Refrigeration systems and cycles",
        pdf: "refrigeration.pdf"
      }

    ]
  },


  manufacturing: {

    name: "Manufacturing",

    topics: [

      {
        title: "Lathe Machine",
        description: "Lathe machine construction and operations",
        pdf: "lathe.pdf"
      },

      {
        title: "Casting",
        description: "Casting process and moulding",
        pdf: "casting.pdf"
      },

      {
        title: "CNC Machine",
        description: "Computer Numerical Control machine",
        pdf: "cnc.pdf"
      }

    ]
  },


  python: {

    name: "Python",

    topics: [

      {
        title: "Python Introduction",
        description: "Introduction to Python programming",
        pdf: "python-introduction.pdf"
      },

      {
        title: "Variables and Data Types",
        description: "Variables and Python data types",
        pdf: "python-variables.pdf"
      },

      {
        title: "Loops",
        description: "For loop and while loop",
        pdf: "python-loops.pdf"
      },

      {
        title: "Functions",
        description: "Python functions and arguments",
        pdf: "python-functions.pdf"
      }

    ]
  }

};


/* OPEN SUBJECT */

function openSubject(key) {

  const subject = materialData[key];

  document.getElementById("subjectsPage")
    .style.display = "none";

  document.getElementById("topicsPage")
    .style.display = "block";

  document.getElementById("selectedSubject")
    .textContent = "📚 " + subject.name;

  document.getElementById("topicSearch")
    .value = "";

  displayTopics(subject.topics);

}


/* DISPLAY TOPICS */

function displayTopics(topics) {

  const container =
    document.getElementById("topicsContainer");

  container.innerHTML = "";

  topics.forEach(topic => {

    container.innerHTML += `

      <div class="topic-card">

        <h3>📘 ${topic.title}</h3>

        <p>${topic.description}</p>

        <button
          class="topic-btn view-topic"
          onclick="viewTopic('${topic.title}')">

          👁 View

        </button>

        <a
          href="${topic.pdf}"
          target="_blank"
          class="topic-btn download-topic">

          📥 Download PDF

        </a>

      </div>

    `;

  });

}


/* SEARCH */

function searchTopics() {

  const search =
    document.getElementById("topicSearch")
    .value
    .toLowerCase();

  const subjectName =
    document.getElementById("selectedSubject")
    .textContent
    .replace("📚 ","");

  let subject;

  for (const key in materialData) {

    if (materialData[key].name === subjectName) {

      subject = materialData[key];

    }

  }

  const filtered =
    subject.topics.filter(topic =>

      topic.title
        .toLowerCase()
        .includes(search)

      ||

      topic.description
        .toLowerCase()
        .includes(search)

    );

  displayTopics(filtered);

}


/* BACK */

function backToSubjects() {

  document.getElementById("topicsPage")
    .style.display = "none";

  document.getElementById("subjectsPage")
    .style.display = "block";

}


/* VIEW */

function viewTopic(topic) {

  alert(
    "You selected: " + topic +
    "\n\nComplete lesson content will be displayed here."
  );

}

</script>

</body>
</html>
